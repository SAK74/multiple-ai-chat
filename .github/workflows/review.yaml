name: Code review
on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - edited
      - reopened

jobs:
  use_action:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      repository-projects: write

    steps:
      - name: Check repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Call the action
        uses: SAK74/code-review-action@master
        with:
          OPENAI_API_KEY: ${{secrets.OPENAI_API_KEY}}
          with-comment: true
        #   open_ai_model: o3
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
